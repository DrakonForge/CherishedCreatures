<style>
  .decorated-container {
    padding: 10;
    anchor-width: 800;
    anchor-height: 550;
  }

  .menu-description {
    anchor-bottom: 10;
  }

  .pet-card {
    anchor-height: 102;
    vertical-align: center;
    background-color: #2a2a3e;
    anchor-vertical: 5;
    padding: 10;
    layout-mode: Left;
  }

  .pet-card-info {
    flex-weight: 1;
    layout-mode: Top;
    anchor-vertical: 10;
  }
  .pet-card-name {
    flex-weight: 2;
    font-weight: bold;
    font-size: 20;
  }

  .pet-card-controls {
    anchor-right: 10;
    anchor-vertical: 10;
    layout-mode: Right;
  }

  .pet-card-list {
    flex-weight: 1;
    layout-mode: TopScrolling;
  }

  .pet-card-status-meters {
    padding: 10;
  }

  .pet-card-status-meter-container {
    layout-mode: Left;
    padding: 10;
  }

  .pet-card-control {
    flex-weight: 1;
    anchor-left: 10;
    anchor-height: 50;
  }

  .pet-image-container {
    anchor-width: 90;
    anchor-height: 90;
    background-color: #212133;
    anchor-left: 6;
    anchor-right: 10;
  }
</style>
<div class="page-overlay">
  <div class="decorated-container" data-hyui-title="Your Pets">
    <div class="container-contents">
      <div class="menu-description">
        <p>Displaying {{$numPets}} pets</p>
      </div>
      <div class="pet-card-list" data-hyui-scrollbar-style="DefaultScrollbarStyle">
        {{#each petCards}}
        <div class="pet-card" id="pet-card-{{$id}}">
          <div class="pet-image-container">

          </div>
          <div class="pet-card-info">
            <p class="pet-card-name">{{$name}}</p>
            <div class="pet-card-status-meters">
              {{#if bondingInfo != null}}
                <div class="pet-card-status-meter-container pet-card-status-bonding">
                  <progress class="circular-progress"
                            value="{{$bondingInfo.fillProgress}}"
                            data-hyui-mask-texture-path="MaskTexture.png"
                            data-hyui-color="#ffffff"
                            style="anchor-width: 20; anchor-height: 20;">
                  </progress>
                </div>
              {{/if}}
            </div>
          </div>
          <div class="pet-card-controls" style="flex-weight: 1;">
              {{#if isLoaded}}
                <button class="pet-card-control small-tertiary-button" id="toggle-summon-{{$id}}">Unsummon</button>
              {{else}}
                <button class="pet-card-control small-tertiary-button" id="toggle-summon-{{$id}}">Summon</button>
              {{/if}}
              <button class="pet-card-control small-tertiary-button" id="view-details-{{$id}}">Details</button>
          </div>
        </div>
        {{/each}}
      </div>

    </div>
  </div>
</div>
